<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>你的名字 - Personal Homepage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --accent: #5b8def;
      --bg: #f5f5f7;
      --text-main: #111827;
      --text-muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #e0edff 0, var(--bg) 45%);
      color: var(--text-main);
    }
    .card {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 28px 28px 32px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
    }
    header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #9333ea);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 32px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .name {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .tagline {
      margin-top: 4px;
      color: var(--text-muted);
    }
    section + section {
      margin-top: 24px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    h2::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
    }
    p {
      margin: 4px 0 0;
    }
    ul {
      margin: 4px 0 0;
      padding-left: 20px;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .chip {
      padding: 4px 10px;
      border-radius: 999px;
      background: #eff3ff;
      font-size: 13px;
      color: #374151;
    }
    .muted {
      color: var(--text-muted);
      font-size: 14px;
    }
    @media (max-width: 600px) {
      .card { padding: 20px 18px 24px; }
      .name { font-size: 24px; }
      .avatar { width: 70px; height: 70px; font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <!-- 圆形头像的字母，可以改成你名字首字母 -->
      <div class="avatar">Q</div>
      <div>
        <div class="name">你的名字</div>
        <div class="tagline">某某大学 · 计算机科学 · 博士生</div>
        <div class="muted">大语言模型安全 / LLM Backdoor / 模型对齐</div>
      </div>
    </header>

    <section>
      <h2>About</h2>
      <p>
        在这里用一两句话介绍自己，比如：我目前在 XXX 大学读博士，研究大语言模型安全与后门攻击相关问题。
      </p>
    </section>

    <section>
      <h2>Research Interests</h2>
      <div class="chips">
        <span class="chip">大模型后门攻击</span>
        <span class="chip">后门防御</span>
        <span class="chip">安全评估</span>
        <span class="chip">多智能体 / 工程化</span>
      </div>
    </section>

    <section>
      <h2>Contact</h2>
      <p>Email: <a href="mailto:your_email@example.com">your_email@example.com</a></p>
      <!-- 如果想显示 GitHub，可以把下面一行的注释去掉并改名字 -->
      <!-- <p>GitHub: <a href="https://github.com/你的用户名">你的用户名</a></p> -->
    </section>
  </main>
</body>
</html>
